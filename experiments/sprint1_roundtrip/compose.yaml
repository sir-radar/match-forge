name: football-gate-a

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: football_prototype
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_prototype"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - prototype-postgres:/var/lib/postgresql

volumes:
  prototype-postgres:
