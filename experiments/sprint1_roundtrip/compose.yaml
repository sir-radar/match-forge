name: football-gate-a

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: ${PROTOTYPE_POSTGRES_DB:?Set PROTOTYPE_POSTGRES_DB in .env}
      POSTGRES_USER: ${PROTOTYPE_POSTGRES_USER:?Set PROTOTYPE_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${PROTOTYPE_POSTGRES_PASSWORD:?Set PROTOTYPE_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PROTOTYPE_POSTGRES_PORT:?Set PROTOTYPE_POSTGRES_PORT in .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - prototype-postgres:/var/lib/postgresql

volumes:
  prototype-postgres:
