[mcp_servers.matchforge_code]
command = "sh"
args = ["-c", 'exec sh "$(git rev-parse --show-toplevel)/scripts/code-intelligence.sh" serve']
startup_timeout_sec = 120
tool_timeout_sec = 120
enabled_tools = ["search_graph", "trace_path", "query_graph", "get_code_snippet", "get_file_outline", "index_repository", "index_status", "check_index_coverage", "list_projects"]
