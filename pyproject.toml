[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "football-forecasting"
version = "0.1.0"
description = "Reproducible data foundation for football forecasting"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema>=4.25,<5",
  "numpy>=2.5,<3",
  "penaltyblog==1.13.0",
  "polars>=1.33,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow==25.0.1",
  "scipy>=1.16,<2",
  "tzdata==2026.3",
]

[project.scripts]
football = "football.cli:main"

[dependency-groups]
dev = [
  "coverage>=7.10,<8",
  "hatchling>=1.27,<2",
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.sdist]
# Hatch can ignore VCS exclusions when a worktree lives beneath an ignored directory.
exclude = [
    "/.env",
    "/.local/",
    "/.tools/",
    "/.venv/",
    "/target/",
    "/web/.next/",
    "/web/node_modules/",
    "/web/test-results/",
]

[tool.hatch.build.targets.wheel]
packages = ["python/football/src/football"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/quality/statsbomb-quality-policy-v1.json" = "football/validation/statsbomb-quality-policy-v1.json"
"schemas/contracts/historical-source-manifest-v1.schema.json" = "football/product/historical-source-manifest-v1.schema.json"
"schemas/contracts/fixture-feature-snapshot-v1.schema.json" = "football/observability/fixture-feature-snapshot-v1.schema.json"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests", "python/football/tests"]
pythonpath = [".", "python/football/src"]

[tool.coverage.run]
branch = true
source = ["python/football/src/football"]

[tool.coverage.report]
# Unit tests alone reach 68% of lines and branches; storage code is covered by
# the integration suite, which is not measured here. Raise this as coverage grows.
fail_under = 67

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# This script records its own SHA-256 in retained evidence, so its bytes stay as executed.
"scripts/run_dcv3_static_heterogeneity_multiplicity.py" = ["E501", "B904"]

[tool.ruff.format]
exclude = ["scripts/run_dcv3_static_heterogeneity_multiplicity.py"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["experiments/sprint1_roundtrip", "python/football/src", "python/football/tests", "scripts"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# This script records its own SHA-256 in retained evidence, so its bytes stay as executed.
module = "scripts.run_dcv3_low_score_structure_diagnostic"
ignore_errors = true
