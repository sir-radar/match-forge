[project]
name = "football-forecasting-gate-a"
version = "0.1.0"
description = "Disposable Sprint 1 architecture-gate prototype"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema>=4.25,<5",
  "polars>=1.33,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow==25.0.1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.138,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["experiments/sprint1_roundtrip"]
ignore_missing_imports = true
