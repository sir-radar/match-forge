name: Set up locked frontend environment
description: Install pinned Node.js, pnpm, and locked frontend dependencies
runs:
  using: composite
  steps:
    - name: Install pnpm 10.19.0
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 10.19.0

    - name: Install Node.js 24
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '24'
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml

    - name: Install locked frontend dependencies
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
