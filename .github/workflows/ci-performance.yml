name: CI performance

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Summarize recent CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_performance.py >> "$GITHUB_STEP_SUMMARY"
