name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Deterministic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Go 1.27.0
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Install uv 0.12.1
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.1
          enable-cache: false

      - name: Install locked Python dependencies and Go tools
        run: |
          mkdir -p .tools/bin
          GOBIN="$GITHUB_WORKSPACE/.tools/bin" go install github.com/pressly/goose/v3/cmd/goose@v3.27.1
          GOBIN="$GITHUB_WORKSPACE/.tools/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          uv python install 3.13.14
          uv sync --locked

      - name: Run deterministic core checks
        run: make check

      - name: Run integration checks
        run: make integration

      - name: Check diff whitespace
        run: git diff --check

      - name: Tear down integration services
        if: ${{ always() }}
        run: docker compose down --volumes
