name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch comparison commit
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          zero_sha="0000000000000000000000000000000000000000"

          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" == "$zero_sha" ]]; then
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

      - name: Check diff and classify files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          zero_sha="0000000000000000000000000000000000000000"
          code_changed=true

          if [[ -n "${BASE_SHA:-}" &&
                "$BASE_SHA" != "$zero_sha" ]] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD

            code_changed=false
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md|*.mdx|*.rst)
                  ;;
                *)
                  code_changed=true
                  break
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" HEAD)
          fi

          printf 'code_changed=%s\n' "$code_changed" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Deterministic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      # rust-toolchain.toml pins the macOS arm64 target.
      # Override only the channel selector on Linux CI.
      RUSTUP_TOOLCHAIN: 1.97.1
      # Match scripts/toolchain.sh for both tool installation and checks.
      GOCACHE: ${{ github.workspace }}/.local/go-cache
      GOMODCACHE: ${{ github.workspace }}/.local/go-mod-cache
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.local/golangci-lint-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Go 1.27.3
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          # The project cache below owns these paths, including tool builds.
          cache: false

      # Save refreshed build results per revision; restore dependencies first
      # from the same lock files, then from the same toolchain.
      - name: Restore project Go caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .local/go-cache
            .local/go-mod-cache
            .local/golangci-lint-cache
          key: project-go-${{ runner.os }}-${{ runner.arch }}-1.27.3-${{ hashFiles('go/api/go.mod', 'go/api/go.sum') }}-${{ github.sha }}
          restore-keys: |
            project-go-${{ runner.os }}-${{ runner.arch }}-1.27.3-${{ hashFiles('go/api/go.mod', 'go/api/go.sum') }}-
            project-go-${{ runner.os }}-${{ runner.arch }}-1.27.3-

      - name: Restore pinned Go tools
        id: go-tools-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/bin/goose
            .tools/bin/golangci-lint
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-go-1.27.3-goose-3.27.1-golangci-lint-2.11.4

      - name: Install pinned Go tools
        if: steps.go-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GOBIN: ${{ github.workspace }}/.tools/bin
        run: |
          set -euo pipefail

          mkdir -p "$GOBIN"

          go install github.com/pressly/goose/v3/cmd/goose@v3.27.1 &
          goose_pid=$!

          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4 &
          lint_pid=$!

          goose_status=0
          lint_status=0

          wait "$goose_pid" || goose_status=$?
          wait "$lint_pid" || lint_status=$?

          if (( goose_status != 0 || lint_status != 0 )); then
            exit 1
          fi

      - name: Install Rust 1.97.1 when needed
        shell: bash
        run: |
          set -euo pipefail

          if ! rustup toolchain list | grep -Eq '^1\.97\.1(-|$)'; then
            rustup toolchain install 1.97.1 \
              --profile minimal \
              --component rustfmt \
              --component clippy \
              --no-self-update
          else
            installed_components="$(rustup component list --toolchain 1.97.1 --installed)"

            if ! grep -q '^rustfmt-' <<<"$installed_components"; then
              rustup component add rustfmt --toolchain 1.97.1
            fi

            if ! grep -q '^clippy-' <<<"$installed_components"; then
              rustup component add clippy --toolchain 1.97.1
            fi
          fi

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: rust-1.97.1
          cache-on-failure: true

      - name: Install uv 0.12.1
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.1
          enable-cache: true
          cache-python: true
          # Keep this aligned with scripts/toolchain.sh / Makefile.
          cache-local-path: ${{ github.workspace }}/.local/uv-cache
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Background workers use the same repository-local path as bootstrap.
          uv_binary="$(command -v uv)"
          mkdir -p .tools/bin
          ln -s "$uv_binary" .tools/bin/uv
          .tools/bin/uv --version
          uv python install 3.13.14
          uv sync --locked

      - name: Install pnpm 10.19.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        run: cd web && pnpm install --frozen-lockfile

      - name: Record locked dependency advisory inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/dependency-audit
          set +e
          (cd web && pnpm audit --json) > .local/dependency-audit/frontend.json
          audit_exit=$?
          set -e
          printf '%s\n' "$audit_exit" > .local/dependency-audit/exit-code.txt
          if [[ "$audit_exit" -gt 1 ]]; then
            exit "$audit_exit"
          fi
          node <<'JS'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('.local/dependency-audit/frontend.json', 'utf8'));
          if (!report.metadata?.vulnerabilities) throw new Error('Dependency audit did not return an inventory');
          const advisories = Object.values(report.advisories ?? {});
          for (const advisory of advisories) {
            console.log(`::warning title=Dependency advisory::${advisory.github_advisory_id}: ${advisory.module_name} (${advisory.severity}); see retained audit artifact and reviewed operational disposition.`);
          }
          console.log(JSON.stringify(report.metadata.vulnerabilities));
          JS

      - name: Retain dependency advisory inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dependency-audit
          path: .local/dependency-audit
          retention-days: 7

      - name: Install Playwright browsers
        run: cd web && pnpm exec playwright install --with-deps chromium webkit

      - name: Create ephemeral CI environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          postgres_password="$(openssl rand -hex 24)"
          {
            printf 'POSTGRES_DB=football_ci\n'
            printf 'POSTGRES_USER=football_ci\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$postgres_password"
            printf 'POSTGRES_PORT=55433\n'
            printf 'REDIS_PORT=56379\n'
            printf 'DATABASE_URL=postgresql://football_ci:%s@127.0.0.1:55433/football_ci?sslmode=disable\n' "$postgres_password"
            printf 'POSTGRES_ADDR=127.0.0.1:55433\n'
            printf 'REDIS_ADDR=127.0.0.1:56379\n'
          } > .env

      # One invocation runs shared phony prerequisites only once: check and
      # integration share build; check and web-e2e share web-build.
      - name: Run deterministic, integration, E2E and accessibility checks
        run: make check integration web-e2e

      - name: Tear down integration services
        if: always()
        run: docker compose down --volumes
