name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff and classify files
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code_changed=true
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
            git diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
            if [[ -s "$RUNNER_TEMP/changed-files" ]]; then
              code_changed=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  *.md|*.mdx|*.rst) ;;
                  *) code_changed=true; break ;;
                esac
              done < "$RUNNER_TEMP/changed-files"
            fi
          fi
          printf 'code_changed=%s\n' "$code_changed" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code_changed == 'true'
    name: Deterministic checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The repository rust-toolchain.toml pins the macOS arm64 target. Override
      # its channel selector on Linux; rustup resolves 1.97.1 for this host.
      RUSTUP_TOOLCHAIN: 1.97.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Go 1.27.0
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.0
          cache: false

      - name: Restore pinned Go tools
        id: go-tools-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/bin/goose
            .tools/bin/golangci-lint
          key: go-tools-${{ runner.os }}-${{ runner.arch }}-go-1.27.0-goose-3.27.1-golangci-lint-2.11.4

      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install uv 0.12.1
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.1
          enable-cache: true
          cache-python: true
          cache-local-path: ${{ github.workspace }}/.local/uv-cache
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install pinned Go tools
        if: steps.go-tools-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .tools/bin
          GOBIN="$GITHUB_WORKSPACE/.tools/bin" go install github.com/pressly/goose/v3/cmd/goose@v3.27.1
          GOBIN="$GITHUB_WORKSPACE/.tools/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      - name: Install locked Python dependencies
        run: |
          uv python install 3.13.14
          uv sync --locked

      - name: Run deterministic and integration checks
        run: make check integration

      - name: Tear down integration services
        if: ${{ always() }}
        run: docker compose down --volumes
