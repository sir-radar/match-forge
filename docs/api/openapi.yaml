openapi: 3.1.0
info:
  title: MatchForge MVP API
  version: 0.9.1
  description: >-
    Versioned MatchForge domain responses and protected operational controls.
    Python produces immutable analytical read reports through shared work; Go
    retrieves current checksum-verified reports. Missing or stale required reports
    return 503. Provider IDs and original labels are source provenance only,
    never MatchForge identity or provider-native response objects.
servers:
  - url: http://127.0.0.1:8080
paths:
  /v1/competitions:
    get:
      operationId: listCompetitions
      parameters:
        - { name: continent, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: division, in: query, schema: { type: integer, minimum: 1 } }
        - { name: forecast_available, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Discovered competitions and field availability, content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fixtures:
    get:
      operationId: listFixtures
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: competition, in: query, schema: { type: string, format: uuid } }
        - { name: country, in: query, schema: { type: string } }
        - { name: continent, in: query, schema: { type: string } }
        - { name: forecast_availability, in: query, schema: { $ref: '#/components/schemas/ForecastAvailability' } }
      responses:
        '200': { description: Fixtures grouped by competition, content: { application/json: { schema: { $ref: '#/components/schemas/FixturePage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fixtures/{fixture_id}/live:
    get:
      operationId: getLiveFixture
      parameters: [ { $ref: '#/components/parameters/FixtureId' } ]
      responses:
        '200': { description: Normalized MatchForge live events and statistics with source provenance, content: { application/json: { schema: { $ref: '#/components/schemas/LiveMatch' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Fixture not found }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fixtures/{fixture_id}/context:
    get:
      operationId: getFixtureContext
      parameters: [ { $ref: '#/components/parameters/FixtureId' } ]
      responses:
        '200': { description: Stored Python form/H2H/rest/coach features plus normalized standings and availability, content: { application/json: { schema: { $ref: '#/components/schemas/MatchContext' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fixtures/{fixture_id}/forecasts:
    get:
      operationId: getForecastHistory
      parameters: [ { $ref: '#/components/parameters/FixtureId' } ]
      responses:
        '200': { description: Immutable forecast revisions ordered by issue time and identity, content: { application/json: { schema: { type: object, required: [forecasts], properties: { forecasts: { type: array, items: { $ref: '#/components/schemas/ForecastRevision' } } } } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fixtures/{fixture_id}/forecasts/{forecast_id}:
    get:
      operationId: getForecast
      parameters:
        - { $ref: '#/components/parameters/FixtureId' }
        - { name: forecast_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Immutable pre-kickoff MVP forecast, content: { application/json: { schema: { $ref: '#/components/schemas/Forecast' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/competitions/{competition_id}/standings:
    get:
      operationId: getStandings
      parameters: [ { $ref: '#/components/parameters/CompetitionId' } ]
      responses:
        '200': { description: Normalized stored standings, content: { application/json: { schema: { $ref: '#/components/schemas/StandingPage' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/competitions/{competition_id}/performance:
    get:
      operationId: getCompetitionPerformance
      parameters: [ { $ref: '#/components/parameters/CompetitionId' }, { $ref: '#/components/parameters/AnalyticsHorizon' } ]
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200': { description: Chronological metrics and prior-results baseline comparison, content: { application/json: { schema: { $ref: '#/components/schemas/Performance' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/performance:
    get:
      operationId: listPerformance
      parameters:
        - { $ref: '#/components/parameters/AnalyticsHorizon' }
        - { name: continent, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: competition, in: query, schema: { type: string, format: uuid } }
        - { name: rating, in: query, schema: { type: string, enum: [UNRATED, WATCH, GOOD, STRONG] } }
        - { name: minimum_forecasts, in: query, schema: { type: integer, minimum: 0 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, enum: [20, 50, 100], default: 20 } }
      responses:
        '200': { description: Filtered league performance in deterministic continent, country, and league order, content: { application/json: { schema: { $ref: '#/components/schemas/PerformancePage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/external-predictions:
    get:
      operationId: listExternalPredictions
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, enum: [20, 50, 100], default: 20}}
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: source, in: query, schema: { type: string } }
        - { name: competition, in: query, schema: { type: string } }
        - { name: market, in: query, schema: { type: string } }
        - { name: agreement, in: query, schema: { type: string, enum: [AGREES, WEAK_SUPPORT, DISAGREES, UNABLE_TO_EVALUATE] } }
        - { name: fixture_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Stored source selections and independent comparison, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalPredictionPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fixtures/{fixture_id}/external-predictions:
    get:
      operationId: listFixtureExternalPredictions
      parameters: [ { $ref: '#/components/parameters/FixtureId' } ]
      responses:
        '200': { description: Stored selections for one mapped fixture, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalPredictionPage' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/external-prediction-sources:
    get:
      operationId: listExternalPredictionSources
      responses:
        '200': { description: Access audit, adapter state, and settled tracking metrics, content: { application/json: { schema: { $ref: '#/components/schemas/ExternalPredictionSourcePage' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/admin/sync-runs:
    get:
      summary: Local operational/admin endpoint
      operationId: listSyncRuns
      responses:
        '200': { description: Recent persisted sync runs and current coverage, content: { application/json: { schema: { $ref: '#/components/schemas/SyncRunPage' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/admin/sync-runs/{run_id}:
    get:
      summary: Local operational/admin endpoint
      operationId: getSyncRun
      parameters: [ { name: run_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Persisted sync-run state, content: { application/json: { schema: { $ref: '#/components/schemas/SyncRun' } } } }
        '404': { description: Unknown run, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/sync/mvp: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/openfootball: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/football-data-uk: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/history: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/forecast-refresh: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/external-predictions: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/fotmob: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/pitchapi: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/all: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/operations/{domain}:
    get:
      operationId: getOperationsView
      description: Protected current operational metadata from existing owners. Experiment records describe shared execution work; immutable file run manifests are not scanned or inferred.
      security: [ { AdminCLI: [] }, { AdminBrowserOrigin: [] } ]
      parameters:
        - { name: domain, in: path, required: true, schema: { type: string, enum: [providers, work-orchestrator, ingestion, identity, coverage, data-quality, forecasting, models, experiments, r3-audit] } }
        - { $ref: '#/components/parameters/AdminPage' }
        - { $ref: '#/components/parameters/AdminPageSize' }
      responses:
        '200': { description: Bounded current metadata page, content: { application/json: { schema: { $ref: '#/components/schemas/OperationView' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '500': { $ref: '#/components/responses/AdminInternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/AdminTimeout' }
  /v1/admin/resolution/preview:
    post:
      operationId: previewResolutionDecision
      description: Read-only qualification and exact source/impact preview. No domain decision is published.
      security: [ { AdminCLI: [] }, { AdminBrowserOrigin: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResolutionDecision' } } } }
      responses:
        '200': { description: Qualification, exact inputs and evidence_version; approval_required is true. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '409': { description: Invalid or unavailable decision inputs; preview again. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/admin/resolution/apply:
    post:
      operationId: applyResolutionDecision
      description: >-
        Requires private-local access and the configured owner Bearer credential,
        including for trusted browser Origins. Applies one explicitly approved
        preview after requalification under ordered locks. request_id binds exact
        approved inputs and actor; retries return the original append-only event.
        Domain history remains prospective. Pending downstream work stays explicit.
      security: [ { AdminCLI: [] } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResolutionDecision' } } } }
      responses:
        '200': { description: Durable review event and domain result with downstream status. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '409': { description: Stale, conflicting or unqualified approval; no decision applied. }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/admin/resolution/{view}:
    get:
      operationId: getResolutionView
      description: >-
        Read-only current cases and recorded decisions from existing identity,
        fixture, source and migration owners. File listings check registered byte
        availability; case details retain full dataset integrity checks. Migration
        results report checksum-verified tracked evidence, not a new parity run.
        Resolution decisions and cutover actions are not enabled by this route.
      security: [ { AdminCLI: [] }, { AdminBrowserOrigin: [] } ]
      parameters:
        - { name: view, in: path, required: true, schema: { type: string, enum: [identity, fixtures, missing, parity, cutover, history, detail] } }
        - { $ref: '#/components/parameters/AdminPage' }
        - { $ref: '#/components/parameters/AdminPageSize' }
        - { name: q, in: query, schema: { type: string, maxLength: 256 } }
        - { name: provider, in: query, schema: { type: string, maxLength: 256 } }
        - { name: status, in: query, schema: { type: string, maxLength: 256 } }
        - { name: kind, in: query, schema: { type: string, maxLength: 256 } }
        - { name: case_key, in: query, description: Required for detail; optional history filter., schema: { type: string, maxLength: 256 } }
      responses:
        '200':
          description: A filtered case page, or one case detail when view is detail. Private responses use Cache-Control no-store.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ResolutionPage' }
                  - { $ref: '#/components/schemas/ResolutionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/AdminTimeout' }
  /v1/admin/work:
    get:
      operationId: listWork
      description: Current shared work; reads never claim, expire or reschedule work.
      security: [ { AdminCLI: [] }, { AdminBrowserOrigin: [] } ]
      parameters:
        - { $ref: '#/components/parameters/AdminPage' }
        - { $ref: '#/components/parameters/AdminPageSize' }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/WorkState' } }
      responses:
        '200': { description: Bounded shared-work page, content: { application/json: { schema: { $ref: '#/components/schemas/WorkPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '500': { $ref: '#/components/responses/AdminInternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/AdminTimeout' }
  /v1/admin/work/{work_id}:
    get:
      operationId: getWork
      security: [ { AdminCLI: [] }, { AdminBrowserOrigin: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkId' } ]
      responses:
        '200': { description: Current work metadata without publication lease tokens, content: { application/json: { schema: { $ref: '#/components/schemas/WorkItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '404': { $ref: '#/components/responses/WorkNotFound' }
        '500': { $ref: '#/components/responses/AdminInternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/AdminTimeout' }
  /v1/admin/work/{work_id}/cancel:
    post:
      operationId: cancelWork
      description: Delegates to the existing cancellation owner and revokes publication rights; terminal work is unchanged.
      security: [ { AdminCLI: [] }, { AdminBrowserOrigin: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkId' } ]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '202': { description: Current controlled work or the newly created parent sync work, content: { application/json: { schema: { $ref: '#/components/schemas/WorkItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '404': { $ref: '#/components/responses/WorkNotFound' }
        '409': { description: Work policy or state prevents the action, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Application JSON content type is required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/AdminInternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/AdminTimeout' }
  /v1/admin/work/{work_id}/retry:
    post:
      operationId: retryWork
      description: Releases explicitly blocked work without lowering its deadline, preserves already scheduled retry policy, and delegates terminal parent sync runs to the existing fresh-run retry owner. Other terminal work requires a new domain request and returns 409.
      security: [ { AdminCLI: [] }, { AdminBrowserOrigin: [] } ]
      parameters: [ { $ref: '#/components/parameters/WorkId' } ]
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, additionalProperties: false } } }
      responses:
        '202': { description: Current controlled work or the newly created parent sync work, content: { application/json: { schema: { $ref: '#/components/schemas/WorkItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AdminDenied' }
        '404': { $ref: '#/components/responses/WorkNotFound' }
        '409': { description: Work policy or state prevents the action, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '415': { description: Application JSON content type is required, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/AdminInternalError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/AdminTimeout' }
components:
  securitySchemes:
    AdminCLI: { type: http, scheme: bearer, description: Owner configured credential for origin-less automation; server binding, Host and peer must also be loopback. }
    AdminBrowserOrigin: { type: apiKey, in: header, name: Origin, description: Must exactly match the configured trusted browser Origin; server binding, Host and peer must also be loopback. }
  pathItems:
    StartSync:
      post:
        summary: Local operational/admin endpoint
        requestBody:
          required: false
          content: { application/json: { schema: { $ref: '#/components/schemas/SyncRequest' } } }
        responses:
          '202': { description: Sync queued, content: { application/json: { schema: { $ref: '#/components/schemas/SyncRun' } } } }
          '400': { $ref: '#/components/responses/BadRequest' }
          '409': { description: Another write-heavy sync is active, content: { application/json: { schema: { $ref: '#/components/schemas/SyncConflict' } } } }
          '503': { $ref: '#/components/responses/Unavailable' }
  parameters:
    AdminPage: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    AdminPageSize: { name: page_size, in: query, schema: { type: integer, enum: [20, 50, 100], default: 20 } }
    WorkId: { name: work_id, in: path, required: true, schema: { type: string, format: uuid } }
    AnalyticsHorizon:
      name: horizon
      in: query
      schema: { type: string, enum: [LATEST, 7D, 3D, 24H, 6H, 1H, 15M], default: LATEST }
    FixtureId: { name: fixture_id, in: path, required: true, schema: { type: string, format: uuid } }
    CompetitionId: { name: competition_id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    AdminInternalError: { description: Internal operational failure with no storage details exposed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    AdminDenied: { description: Existing private-local admin access conditions not met, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    AdminTimeout: { description: Request deadline elapsed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    WorkNotFound: { description: Unknown work ID, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unavailable: { description: Product data unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    WorkState: { type: string, enum: [PENDING, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED, BLOCKED] }
    WorkItem:
      type: object
      additionalProperties: false
      required: [work_id, work_type, state, input_hash, priority, requested_at, available_at, started_at, finished_at, lease_until, heartbeat_at, age_seconds, generation, lease_owner, attempt_count, max_attempts, dependency_count, parent_work_id, parent_sync_run_id, dependencies, last_error_code, last_error_message]
      properties:
        work_id: { type: string, format: uuid }
        work_type: { type: string }
        state: { $ref: '#/components/schemas/WorkState' }
        input_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        priority: { type: integer }
        requested_at: { type: string, format: date-time }
        available_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        lease_until: { type: [string, "null"], format: date-time }
        heartbeat_at: { type: [string, "null"], format: date-time }
        age_seconds: { type: number }
        generation: { type: integer, minimum: 0 }
        lease_owner: { type: [string, "null"] }
        attempt_count: { type: integer, minimum: 0 }
        max_attempts: { type: integer, minimum: 1 }
        dependency_count: { type: integer, minimum: 0 }
        parent_work_id: { type: [string, "null"], format: uuid }
        parent_sync_run_id: { type: [string, "null"], format: uuid }
        dependencies: { type: array, maxItems: 100, items: { type: string, format: uuid }, description: First 100 dependency IDs in UUID order; dependency_count exposes the complete count. }
        last_error_code: { type: [string, "null"] }
        last_error_message: { type: [string, "null"], description: Stored diagnostics with common credential formats redacted. }
    WorkPage:
      type: object
      additionalProperties: false
      required: [page, page_size, observed_at, has_more, items]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, enum: [20, 50, 100] }
        observed_at: { type: string, format: date-time }
        has_more: { type: boolean }
        items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/WorkItem' } }
    ResolutionDecision:
      type: object
      additionalProperties: false
      required: [case_key, action, reason]
      properties:
        case_key: { type: string, maxLength: 256 }
        action: { type: string, enum: [APPROVE, REJECT, CORRECT, QUARANTINE, REQUEST_EVIDENCE, BLOCK, REVALIDATE, RESOLVE_DUPLICATE, DEFER] }
        reason: { type: string, minLength: 1, maxLength: 2000 }
        candidate: { type: object, additionalProperties: { type: string, maxLength: 256 } }
        evidence_version: { type: string, pattern: '^[a-f0-9]{64}$' }
        request_id: { type: string, format: uuid }
        approved: { type: boolean, description: Must be true when applying. }
    ResolutionPage:
      type: object
      required: [items, page, page_size, total, counts, groups]
      properties:
        items: { type: array, maxItems: 100, items: { type: object, required: [case_key, status], properties: { case_key: { type: string }, status: { type: string } } } }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, enum: [20, 50, 100] }
        total: { type: integer, minimum: 0, description: Full filtered count, including on an empty page past the end. }
        counts: { type: object, additionalProperties: { type: integer, minimum: 0 }, description: Filtered mutually exclusive status counts whose sum equals total. }
        groups: { type: array, maxItems: 100, items: { type: object } }
        groups_has_more: { type: boolean }
        scope: { type: string }
        blockers: { type: array, items: { type: string } }
    ResolutionDetail:
      type: object
      required: [case_key, status, evidence_version]
      properties:
        case_key: { type: string }
        status: { type: string }
        evidence_version: { type: string, pattern: '^[0-9a-f]{64}$' }
    OperationView:
      type: object
      additionalProperties: false
      required: [domain, source, observed_at, page, page_size, has_more, items]
      properties:
        domain: { type: string, enum: [providers, work-orchestrator, ingestion, identity, coverage, data-quality, forecasting, models, experiments, r3-audit] }
        source: { type: string }
        source_sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: Checksum of the complete tracked project-status document for the R3 view. }
        observed_at: { type: string, format: date-time }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, enum: [20, 50, 100] }
        has_more: { type: boolean }
        items: { type: array, maxItems: 100, items: { type: object }, description: Selected metadata from the named existing domain owner. Model records wrap the unchanged registration under registration; experiment records are shared execution work. }
    Error: { type: object, required: [error], properties: { error: { type: string } } }
