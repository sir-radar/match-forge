openapi: 3.1.0
info:
  title: MatchForge MVP API
  version: 0.5.0
  description: MatchForge product API plus fixed-action local operational/admin synchronization endpoints.
servers:
  - url: http://127.0.0.1:8080
paths:
  /v1/competitions:
    get:
      operationId: listCompetitions
      parameters:
        - { name: continent, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: division, in: query, schema: { type: integer, minimum: 1 } }
        - { name: forecast_available, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Discovered competitions and field availability, content: { application/json: { schema: { $ref: '#/components/schemas/CompetitionPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fixtures:
    get:
      operationId: listFixtures
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: competition, in: query, schema: { type: string, format: uuid } }
        - { name: country, in: query, schema: { type: string } }
        - { name: continent, in: query, schema: { type: string } }
        - { name: forecast_availability, in: query, schema: { $ref: '#/components/schemas/ForecastAvailability' } }
      responses:
        '200': { description: Fixtures grouped by competition, content: { application/json: { schema: { $ref: '#/components/schemas/FixturePage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fixtures/{fixture_id}/context:
    get:
      operationId: getFixtureContext
      parameters: [ { $ref: '#/components/parameters/FixtureId' } ]
      responses:
        '200': { description: Display-only recent form, H2H, standings, and availability, content: { application/json: { schema: { type: object } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fixtures/{fixture_id}/forecasts/{forecast_id}:
    get:
      operationId: getForecast
      parameters:
        - { $ref: '#/components/parameters/FixtureId' }
        - { name: forecast_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Immutable pre-kickoff MVP forecast, content: { application/json: { schema: { $ref: '#/components/schemas/Forecast' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/competitions/{competition_id}/standings:
    get:
      operationId: getStandings
      parameters: [ { $ref: '#/components/parameters/CompetitionId' } ]
      responses:
        '200': { description: Provider or completed-results fallback standings, content: { application/json: { schema: { type: object } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/competitions/{competition_id}/performance:
    get:
      operationId: getCompetitionPerformance
      parameters: [ { $ref: '#/components/parameters/CompetitionId' } ]
      responses:
        '200': { description: Chronological metrics and prior-results baseline comparison, content: { application/json: { schema: { $ref: '#/components/schemas/Performance' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/performance:
    get:
      operationId: listPerformance
      parameters:
        - { name: continent, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: competition, in: query, schema: { type: string, format: uuid } }
        - { name: rating, in: query, schema: { type: string, enum: [UNRATED, WATCH, GOOD, STRONG] } }
        - { name: minimum_forecasts, in: query, schema: { type: integer, minimum: 0 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, enum: [20, 50, 100], default: 20 } }
      responses:
        '200': { description: Filtered league performance in deterministic continent, country, and league order, content: { application/json: { schema: { $ref: '#/components/schemas/PerformancePage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/external-predictions:
    get:
      operationId: listExternalPredictions
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: source, in: query, schema: { type: string } }
        - { name: competition, in: query, schema: { type: string } }
        - { name: market, in: query, schema: { type: string } }
        - { name: agreement, in: query, schema: { type: string, enum: [AGREES, WEAK_SUPPORT, DISAGREES, UNABLE_TO_EVALUATE] } }
        - { name: fixture_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Stored source selections and independent comparison, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/fixtures/{fixture_id}/external-predictions:
    get:
      operationId: listFixtureExternalPredictions
      parameters: [ { $ref: '#/components/parameters/FixtureId' } ]
      responses:
        '200': { description: Stored selections for one mapped fixture, content: { application/json: { schema: { type: object } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/external-prediction-sources:
    get:
      operationId: listExternalPredictionSources
      responses:
        '200': { description: Access audit, adapter state, and settled tracking metrics, content: { application/json: { schema: { type: object } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/admin/sync-runs:
    get:
      summary: Local operational/admin endpoint
      operationId: listSyncRuns
      responses:
        '200': { description: Recent persisted sync runs and current coverage, content: { application/json: { schema: { $ref: '#/components/schemas/SyncRunPage' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/admin/sync-runs/{run_id}:
    get:
      summary: Local operational/admin endpoint
      operationId: getSyncRun
      parameters: [ { name: run_id, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Persisted sync-run state, content: { application/json: { schema: { $ref: '#/components/schemas/SyncRun' } } } }
        '404': { description: Unknown run, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/admin/sync/mvp: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/openfootball: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/football-data-uk: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/history: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/forecast-refresh: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/external-predictions: { $ref: '#/components/pathItems/StartSync' }
  /v1/admin/sync/all: { $ref: '#/components/pathItems/StartSync' }
components:
  pathItems:
    StartSync:
      post:
        summary: Local operational/admin endpoint
        requestBody:
          required: false
          content: { application/json: { schema: { $ref: '#/components/schemas/SyncRequest' } } }
        responses:
          '202': { description: Sync queued, content: { application/json: { schema: { $ref: '#/components/schemas/SyncRun' } } } }
          '400': { $ref: '#/components/responses/BadRequest' }
          '409': { description: Another write-heavy sync is active, content: { application/json: { schema: { $ref: '#/components/schemas/SyncConflict' } } } }
          '503': { $ref: '#/components/responses/Unavailable' }
  parameters:
    FixtureId: { name: fixture_id, in: path, required: true, schema: { type: string, format: uuid } }
    CompetitionId: { name: competition_id, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unavailable: { description: Product data unavailable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error: { type: object, required: [error], properties: { error: { type: string } } }
    SyncType: { type: string, enum: [MVP_SYNC, OPENFOOTBALL, FOOTBALL_DATA_UK, HISTORY_BACKFILL, FORECAST_REFRESH, EXTERNAL_PREDICTIONS, ALL_DATA] }
    SyncStatus: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED] }
    SyncRequest:
      type: object
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        season: { type: string }
        competition: { type: string }
        country: { type: string }
    SyncRun:
      type: object
      required: [run_id, sync_type, status, requested_at, started_at, finished_at, requested_date, parameters, summary, error_message, log_path]
      properties:
        run_id: { type: string, format: uuid }
        sync_type: { $ref: '#/components/schemas/SyncType' }
        status: { $ref: '#/components/schemas/SyncStatus' }
        requested_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        requested_date: { type: [string, 'null'], format: date }
        parameters: { type: object, additionalProperties: true }
        summary: { type: object, additionalProperties: true }
        error_message: { type: [string, 'null'] }
        log_path: { type: [string, 'null'] }
    SyncConflict:
      type: object
      required: [error, active_run]
      properties:
        error: { type: string }
        active_run: { $ref: '#/components/schemas/SyncRun' }
    HistoricalCoverage:
      type: object
      required: [historical_matches, competitions_with_history, teams_with_10_matches, teams_below_10_matches, scheduled_fixtures, forecast_available, not_enough_history, mapping_failures, source_conflicts]
      additionalProperties: false
      properties:
        historical_matches: { type: integer, minimum: 0 }
        competitions_with_history: { type: integer, minimum: 0 }
        teams_with_10_matches: { type: integer, minimum: 0 }
        teams_below_10_matches: { type: integer, minimum: 0 }
        scheduled_fixtures: { type: integer, minimum: 0 }
        forecast_available: { type: integer, minimum: 0 }
        not_enough_history: { type: integer, minimum: 0 }
        mapping_failures: { type: integer, minimum: 0 }
        source_conflicts: { type: integer, minimum: 0 }
    SyncRunPage:
      type: object
      required: [runs, coverage]
      properties:
        runs: { type: array, items: { $ref: '#/components/schemas/SyncRun' } }
        coverage: { $ref: '#/components/schemas/HistoricalCoverage' }
    ForecastAvailability: { type: string, enum: [FORECAST_AVAILABLE, NOT_ENOUGH_HISTORY, SOURCE_DATA_INCOMPLETE, TEMPORARILY_UNAVAILABLE] }
    Availability:
      type: object
      required: [fixtures, results, standings, h2h, forecast, xg, team_stats]
      properties:
        fixtures: { type: boolean }
        results: { type: boolean }
        standings: { type: boolean }
        h2h: { type: boolean }
        forecast: { type: boolean }
        xg: { type: boolean }
        team_stats: { type: boolean }
    Competition:
      type: object
      required: [id, name, country, continent, type, season, availability, availability_status, sources]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        country: { type: string }
        continent: { type: string }
        division: { type: [integer, 'null'] }
        type: { type: string, enum: [LEAGUE, CUP] }
        season: { type: string }
        availability: { $ref: '#/components/schemas/Availability' }
        availability_status: { $ref: '#/components/schemas/ForecastAvailability' }
        sources: { type: object, additionalProperties: { type: array, items: { type: string } } }
    CompetitionPage:
      type: object
      required: [competitions]
      properties: { competitions: { type: array, items: { $ref: '#/components/schemas/Competition' } } }
    Team:
      type: object
      required: [id, name, crest_url]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        crest_url: { type: [string, 'null'], format: uri }
    ForecastSummary:
      type: object
      required: [id, expected_home_goals, expected_away_goals, probabilities]
      properties:
        id: { type: string, format: uuid }
        expected_home_goals: { type: number, exclusiveMinimum: 0 }
        expected_away_goals: { type: number, exclusiveMinimum: 0 }
        probabilities: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 } }
    Fixture:
      type: object
      required: [id, kickoff_at, status, home, away, home_score, away_score, venue, round, forecast_availability, forecast]
      properties:
        id: { type: string, format: uuid }
        kickoff_at: { type: string, format: date-time }
        status: { type: string, enum: [SCHEDULED, LIVE, FINISHED, POSTPONED, CANCELLED, ABANDONED] }
        home: { $ref: '#/components/schemas/Team' }
        away: { $ref: '#/components/schemas/Team' }
        home_score: { type: [integer, 'null'], minimum: 0 }
        away_score: { type: [integer, 'null'], minimum: 0 }
        venue: { type: [string, 'null'] }
        round: { type: [string, 'null'] }
        forecast_availability: { $ref: '#/components/schemas/ForecastAvailability' }
        forecast: { anyOf: [ { $ref: '#/components/schemas/ForecastSummary' }, { type: 'null' } ] }
    FixtureGroup:
      type: object
      required: [competition, fixtures]
      properties:
        competition: { $ref: '#/components/schemas/Competition' }
        fixtures: { type: array, items: { $ref: '#/components/schemas/Fixture' } }
    FixturePage:
      type: object
      required: [date, groups]
      properties:
        date: { type: string, format: date }
        groups: { type: array, items: { $ref: '#/components/schemas/FixtureGroup' } }
    Forecast:
      allOf:
        - { $ref: '#/components/schemas/ForecastSummary' }
        - type: object
          required: [fixture_id, model_label, model_algorithm_version, created_at, football_cutoff, knowledge_cutoff, knowledge_mode, publication_mode, score_matrix]
          properties:
            fixture_id: { type: string, format: uuid }
            model_label: { type: string, const: MVP_FORECAST }
            model_algorithm_version: { type: string }
            created_at: { type: string, format: date-time }
            football_cutoff: { type: string, format: date-time }
            knowledge_cutoff: { type: string, format: date-time }
            knowledge_mode: { type: string, const: bitemporal }
            publication_mode: { type: string, const: MVP_OWNER_AUTHORIZED }
            score_matrix: { type: array, items: { type: object } }
    Performance:
      type: object
      required: [competition_id, league, country, continent, rating, forecasts]
      properties:
        competition_id: { type: string, format: uuid }
        league: { type: string }
        country: { type: string }
        continent: { type: string }
        rating: { type: string, enum: [UNRATED, WATCH, GOOD, STRONG] }
        forecasts: { type: integer, minimum: 0 }
        brier: { type: [number, 'null'] }
        log_loss: { type: [number, 'null'] }
        baseline_brier: { type: [number, 'null'] }
        baseline_log_loss: { type: [number, 'null'] }
    Pagination:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, enum: [20, 50, 100] }
        total_items: { type: integer, minimum: 0 }
        total_pages: { type: integer, minimum: 0 }
    PerformancePage:
      type: object
      required: [performance, pagination]
      properties:
        performance: { type: array, items: { $ref: '#/components/schemas/Performance' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
